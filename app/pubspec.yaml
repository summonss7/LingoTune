name: lingotune
description: Language learning through music application

publish_to: 'none'
version: 5.7.5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.2

  just_audio: ^0.9.36
  audio_service: ^0.18.12
  audio_session: ^0.1.18
  record: ^7.1.1
  path_provider: ^2.1.2
  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.2
  http: ^1.2.0
  provider: ^6.1.1
  file_picker: ^8.0.0
  uuid: ^4.3.3
  archive: ^3.4.0
  share_plus: ^10.1.4
  image_picker: ^1.0.4
  image: ^4.0.0
  permission_handler: ^11.3.1
  # image_cropper: ^8.0.1  # Temporarily disabled due to Android 13+ crashes
  device_info_plus: ^10.1.0
  flutter_tts: ^4.2.0
  sherpa_onnx: ^1.13.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/
    - assets/sounds/
    - assets/calibration/
    - assets/tts/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  adaptive_icon_background: "#6200EE"
  image_path: "assets/icon.png"
  min_sdk_android: 21
